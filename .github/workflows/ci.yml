name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile package
        run: python -m compileall -q pennovia
      - name: Static correctness
        run: python -m ruff check pennovia tests
      - name: Test
        run: python -m pytest -q tests/
      - name: CLI smoke test
        run: |
          pennovia --version
          pennovia studio --help
      - name: Studio browser script syntax
        run: node --check pennovia/studio/app.js
      - name: Offline demo
        env:
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          OPENROUTER_API_KEY: ''
        run: python -m pennovia.demo

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CLI container
        run: docker build -t pennovia-ci .
      - name: CLI and offline demo
        run: |
          docker run --rm pennovia-ci --version
          docker run --rm pennovia-ci demo

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build distribution wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Install wheel in isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/pennovia-wheel-env"
          "$RUNNER_TEMP/pennovia-wheel-env/bin/python" -m pip install dist/pennovia-*.whl
      - name: Exercise installed package outside source checkout
        env:
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          OPENROUTER_API_KEY: ''
          PENNOVIA_BACKEND: auto
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pennovia-wheel-env/bin/pennovia" --version
          "$RUNNER_TEMP/pennovia-wheel-env/bin/pennovia" demo
          "$RUNNER_TEMP/pennovia-wheel-env/bin/python" -c 'from pathlib import Path; import pennovia.demo; p = Path(pennovia.demo.__file__).parent / "corpus"; assert len(list(p.glob("*.txt"))) == 3'
          "$RUNNER_TEMP/pennovia-wheel-env/bin/pennovia" studio --help
          "$RUNNER_TEMP/pennovia-wheel-env/bin/python" -c 'from importlib.resources import files; p = files("pennovia.studio"); assert all(p.joinpath(f).is_file() for f in ("index.html", "app.css", "app.js"))'
