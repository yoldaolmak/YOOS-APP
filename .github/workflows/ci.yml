name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile package
        run: python -m compileall -q yoos_app
      - name: Test
        run: python -m pytest -q tests/
      - name: CLI smoke test
        run: yoos-app --version
      - name: Offline demo
        env:
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          OPENROUTER_API_KEY: ''
        run: python -m yoos_app.demo
